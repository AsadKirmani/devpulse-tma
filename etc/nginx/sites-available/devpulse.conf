server {
    listen 80;
    server_name devpulse.app api.devpulse.app;

    # Redirect all insecure requests straight to TLS standard
    return 301 https://$host$request_uri;
}

# 1. Frontend Webview Profile Gateway Configuration
server {
    listen 443 ssl http2;
    server_name devpulse.app;

    # SSL Certificates managed easily via Let's Encrypt Certbot
    ssl_certificate /etc/letsencrypt/live/devpulse.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devpulse.app/privkey.pem;

    location / {
        proxy_pass http://localhost:3001; # Pointing to running Next.js Container
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. Backend Engine / Webhook Collector Routing Configuration
server {
    listen 443 ssl http2;
    server_name api.devpulse.app;

    ssl_certificate /etc/letsencrypt/live/api.devpulse.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.devpulse.app/privkey.pem;

    location / {
        proxy_pass http://localhost:3000; # Pointing to running NestJS Container
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
